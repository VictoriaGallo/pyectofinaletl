project:
  name: proyecto_final_gyd
  version: 1.0.0
  description: proyecto para practicar  
  author: laura vitoria gallo payana
  license: MIT
  repository:
  date: 2024-06-10


paths:
  data_dir: data
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold
  logs_dir: logs
  notebooks_dir: notebooks


sources:
  FastFoodSalesReport:
    path: data/bronze/
    file_name: fast_food_sales_report.csv
    file_type: csv
  
  food_sales:
    path: data/bronze/
    file_name: food_Waste.csv
    file_type: csv

constants:
  date_format: '%Y-%m-%d'
  datetime_format: '%Y-%m-%d %H:%M:%S'


  rutas:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  logs: logs/logs.txt
 
# Supuestos de la merma simulada (capa oro, gold_data.py)
simulacion:
  porcentaje_costo_insumo: 0.35   # costo del insumo como fracción del precio de venta
  colchon_seguridad: 0.10         # se prepara un 10 % por encima del pronóstico
  semanas_historia: 4             # semanas usadas para pronosticar la demanda
 
# Carga a PostgreSQL (load_database.py)
base_de_datos:
  driver: postgresql+psycopg2
  crear_base_si_no_existe: true   # crea la base de DB_NAME si no existe
  modo_carga: replace             # replace: borra y recarga cada tabla | append: agrega filas
  capas:                          # capa del proyecto -> esquema en PostgreSQL
    silver: silver
    gold: gold